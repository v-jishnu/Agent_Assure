<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AgentAssure — Governance Console</title>
<style>
  :root {
    --bg: #0b1220;
    --panel: #111c2e;
    --panel-2: #17263c;
    --line: #24354f;
    --text: #dbe5f2;
    --muted: #8398b3;
    --accent: #4f9cf9;
    --block: #ff5f6d;
    --ask: #ffb020;
    --allow: #3ed598;
    --mask: #59d5d0;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg); color: var(--text);
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    font-size: 14px; line-height: 1.5;
  }
  .wrap { max-width: 1280px; margin: 0 auto; padding: 0 22px 60px; }

  header {
    display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
    padding: 20px 0; border-bottom: 1px solid var(--line); margin-bottom: 22px;
  }
  .logo { font-size: 20px; font-weight: 700; letter-spacing: .2px; }
  .logo span { color: var(--accent); }
  .tagline { color: var(--muted); font-size: 12px; }
  .spacer { flex: 1; }

  .pill {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 7px 14px; border-radius: 999px; font-size: 12.5px; font-weight: 600;
  }
  .pill.ok  { background: rgba(62,213,152,.12); color: var(--allow); border: 1px solid rgba(62,213,152,.4); }
  .pill.bad { background: rgba(255,95,109,.12); color: var(--block); border: 1px solid rgba(255,95,109,.45); }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: currentColor; }
  .stamp { color: var(--muted); font-size: 11.5px; font-variant-numeric: tabular-nums; }

  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px,1fr)); gap: 14px; margin-bottom: 22px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 15px 17px; }
  .card .k { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .7px; margin-bottom: 7px; }
  .card .v { font-size: 27px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .card.block .v { color: var(--block); }
  .card.ask   .v { color: var(--ask); }
  .card.mask  .v { color: var(--mask); }
  .card.allow .v { color: var(--allow); }

  .cols { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
  @media (max-width: 900px) { .cols { grid-template-columns: 1fr; } }

  .panel {
    background: var(--panel); border: 1px solid var(--line);
    border-radius: 12px; padding: 17px; margin-bottom: 18px;
  }
  .panel h2 { font-size: 14px; margin-bottom: 4px; }
  .panel .sub { color: var(--muted); font-size: 12px; margin-bottom: 14px; }

  table { width: 100%; border-collapse: collapse; }
  th {
    text-align: left; color: var(--muted); font-size: 10.5px; font-weight: 600;
    text-transform: uppercase; letter-spacing: .6px;
    padding: 8px 10px; border-bottom: 1px solid var(--line); white-space: nowrap;
  }
  td { padding: 9px 10px; border-bottom: 1px solid rgba(36,53,79,.55); font-size: 12.5px; vertical-align: top; }
  tr.click { cursor: pointer; }
  tr.click:hover td { background: var(--panel-2); }
  .mono { font-family: Consolas, "SF Mono", monospace; font-size: 11.5px; color: var(--muted); }

  .chip {
    display: inline-block; padding: 3px 9px; border-radius: 999px;
    font-size: 10.5px; font-weight: 700; letter-spacing: .4px; white-space: nowrap;
  }
  .chip.BLOCK { background: rgba(255,95,109,.15); color: var(--block); }
  .chip.ASK   { background: rgba(255,176,32,.15); color: var(--ask); }
  .chip.ALLOW { background: rgba(62,213,152,.13); color: var(--allow); }
  .chip.SHADOW{ background: rgba(131,152,179,.15); color: var(--muted); }
  .cite {
    display: inline-block; font-size: 10.5px; color: var(--accent);
    background: rgba(79,156,249,.11); padding: 2px 8px; border-radius: 4px;
    font-family: Consolas, monospace;
  }

  .bar-row { display: grid; grid-template-columns: 1fr 46px; gap: 10px; align-items: center; margin-bottom: 11px; }
  .bar-label { font-size: 12px; }
  .bar-label .pid { color: var(--muted); font-size: 11px; font-family: Consolas, monospace; }
  .bar-track { background: var(--panel-2); border-radius: 5px; height: 7px; margin-top: 5px; overflow: hidden; }
  .bar-fill { height: 100%; background: var(--accent); border-radius: 5px; }
  .bar-n { text-align: right; color: var(--muted); font-variant-numeric: tabular-nums; }

  .filters { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }
  .filters button {
    background: transparent; border: 1px solid var(--line); color: var(--muted);
    padding: 5px 12px; border-radius: 7px; font-size: 12px; font-weight: 600; cursor: pointer;
  }
  .filters button.on { background: var(--accent); border-color: var(--accent); color: #062744; }

  .back { background: none; border: none; color: var(--accent); font-weight: 600;
          font-size: 12.5px; cursor: pointer; padding: 0; margin-bottom: 12px; }
  .empty { color: var(--muted); text-align: center; padding: 26px; font-size: 13px; }
  .reason { color: var(--muted); font-size: 11.5px; max-width: 48ch; }
  .redact { color: var(--mask); font-family: Consolas, monospace; font-size: 11px; }
  code.io {
    display: block; color: #a8c3e0; font-family: Consolas, monospace; font-size: 11px;
    background: #0a1424; border: 1px solid var(--line); border-radius: 6px;
    padding: 8px 10px; margin-top: 6px; white-space: pre-wrap; word-break: break-all;
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div>
      <div class="logo">Agent<span>Assure</span></div>
      <div class="tagline">Runtime governance &amp; assurance layer for AI agents</div>
    </div>
    <div class="spacer"></div>
    <span id="chain" class="pill ok"><span class="dot"></span>checking…</span>
    <span id="stamp" class="stamp"></span>
  </header>

  <div class="cards" id="cards"></div>

  <div class="cols">
    <div class="panel">
      <h2>Control coverage</h2>
      <p class="sub">Enforcement actions grouped by the clause they evidence.</p>
      <div id="controls"></div>
    </div>

    <div class="panel">
      <h2>Agent runs</h2>
      <p class="sub">One row per trace. Click to open its decision trail.</p>
      <div id="traces"></div>
    </div>
  </div>

  <div class="panel">
    <h2 id="evTitle">Evidence records</h2>
    <p class="sub" id="evSub">Every governed event, hash-chained in order.</p>
    <button class="back" id="back" style="display:none">&larr; All records</button>
    <div class="filters" id="filters"></div>
    <div id="evidence"></div>
  </div>

</div>

<script>
const $ = id => document.getElementById(id);
let FILTER = "ALL";
let TRACE = null;

async function get(path) {
  const r = await fetch(path);
  if (!r.ok) throw new Error(path + " -> " + r.status);
  return r.json();
}

function esc(s) {
  return String(s ?? "").replace(/[&<>"]/g, c =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
}

function shortTime(ts) {
  return String(ts || "").slice(11, 19);
}

function renderCards(s) {
  const cards = [
    ["Evidence records", s.records, ""],
    ["Agent runs", s.traces, ""],
    ["Actions blocked", s.blocked, "block"],
    ["Pending approval", s.pending_approval, "ask"],
    ["PII masked at rest", s.redactions, "mask"],
    ["Records cited", s.cited, "allow"],
  ];
  $("cards").innerHTML = cards.map(([k, v, cls]) =>
    `<div class="card ${cls}"><div class="k">${k}</div><div class="v">${v}</div></div>`
  ).join("");
}

function renderChain(s) {
  const el = $("chain");
  const ok = s.chain.is_valid;
  el.className = "pill " + (ok ? "ok" : "bad");
  el.innerHTML = `<span class="dot"></span>` + (ok
    ? `Evidence chain intact &middot; ${s.records} records`
    : `TAMPER DETECTED &middot; ${s.chain.errors.length} error(s)`);
  $("stamp").textContent = "re-verified " + new Date().toLocaleTimeString();
}

function renderControls(s) {
  if (!s.by_control.length) {
    $("controls").innerHTML = `<div class="empty">No enforcement actions recorded yet.</div>`;
    return;
  }
  const max = Math.max(...s.by_control.map(c => c.count));
  $("controls").innerHTML = s.by_control.map(c => `
    <div class="bar-row">
      <div>
        <div class="bar-label">${esc(c.citation)}
          <span class="pid">${esc(c.policies.join(", "))}</span></div>
        <div class="bar-track"><div class="bar-fill" style="width:${(c.count / max) * 100}%"></div></div>
      </div>
      <div class="bar-n">${c.count}</div>
    </div>`).join("");
}

function renderTraces(rows) {
  if (!rows.length) {
    $("traces").innerHTML = `<div class="empty">No runs yet — run <code>python demo/loan_agent.py</code></div>`;
    return;
  }
  $("traces").innerHTML = `<table><thead><tr>
      <th>Trace</th><th>Session</th><th>Started</th><th>Events</th><th>Status</th>
    </tr></thead><tbody>` + rows.map(t => {
      const status = t.blocked ? `<span class="chip BLOCK">blocked</span>`
        : t.pending ? `<span class="chip ASK">pending</span>`
        : `<span class="chip ALLOW">clean</span>`;
      return `<tr class="click" data-trace="${esc(t.trace_id)}">
        <td class="mono">${esc(t.trace_id)}</td>
        <td class="mono">${esc(t.session_id)}</td>
        <td class="mono">${shortTime(t.started_at)}</td>
        <td>${t.records}</td><td>${status}</td></tr>`;
    }).join("") + `</tbody></table>`;

  $("traces").querySelectorAll("tr.click").forEach(tr =>
    tr.onclick = () => { TRACE = tr.dataset.trace; FILTER = "ALL"; refresh(); });
}

function renderFilters(records) {
  const counts = { ALL: records.length };
  records.forEach(r => { if (r.decision) counts[r.decision] = (counts[r.decision] || 0) + 1; });
  const order = ["ALL", "BLOCK", "ASK", "ALLOW", "SHADOW"];
  $("filters").innerHTML = order.filter(k => counts[k]).map(k =>
    `<button class="${FILTER === k ? "on" : ""}" data-f="${k}">${k} (${counts[k]})</button>`
  ).join("");
  $("filters").querySelectorAll("button").forEach(b =>
    b.onclick = () => { FILTER = b.dataset.f; refresh(); });
}

function renderEvidence(records) {
  const rows = FILTER === "ALL" ? records : records.filter(r => r.decision === FILTER);
  if (!rows.length) {
    $("evidence").innerHTML = `<div class="empty">No records match this filter.</div>`;
    return;
  }
  $("evidence").innerHTML = `<table><thead><tr>
      <th>#</th><th>Time</th><th>Event</th><th>Tool</th><th>Decision</th>
      <th>Policy</th><th>Control cited</th><th>Reason</th><th>Hash</th>
    </tr></thead><tbody>` + rows.map(r => `
      <tr>
        <td class="mono">${r.id}</td>
        <td class="mono">${shortTime(r.timestamp)}</td>
        <td class="mono">${esc(r.event_type)}</td>
        <td>${esc(r.tool_name || "—")}
          ${r.redactions ? `<div class="redact">${r.redactions} PII masked</div>` : ""}</td>
        <td>${r.decision ? `<span class="chip ${esc(r.decision)}">${esc(r.decision)}</span>` : "—"}</td>
        <td class="mono">${esc(r.policy_id || "—")}</td>
        <td>${r.controls ? `<span class="cite">${esc(r.controls)}</span>` : "—"}</td>
        <td class="reason">${esc((r.reason || "").slice(0, 120))}</td>
        <td class="mono">${esc((r.record_hash || "").slice(0, 10))}…</td>
      </tr>
      ${TRACE && (r.input || r.output) ? `<tr><td></td><td colspan="8">
        ${r.input ? `<code class="io">in  ${esc(r.input)}</code>` : ""}
        ${r.output ? `<code class="io">out ${esc(r.output)}</code>` : ""}
      </td></tr>` : ""}
    `).join("") + `</tbody></table>`;
}

async function refresh() {
  try {
    const [stats, traces] = await Promise.all([
      get("/api/v1/stats"), get("/api/v1/traces"),
    ]);
    renderCards(stats);
    renderChain(stats);
    renderControls(stats);
    renderTraces(traces);

    const path = TRACE ? `/api/v1/evidence?trace_id=${encodeURIComponent(TRACE)}`
                       : "/api/v1/evidence";
    const records = await get(path);
    $("evTitle").textContent = TRACE ? `Decision trail — ${TRACE}` : "Evidence records";
    $("evSub").textContent = TRACE
      ? "Every event in this run, in execution order, with recorded inputs and outputs."
      : "Every governed event, hash-chained in order.";
    $("back").style.display = TRACE ? "inline-block" : "none";
    renderFilters(records);
    renderEvidence(records);
  } catch (e) {
    $("chain").className = "pill bad";
    $("chain").innerHTML = `<span class="dot"></span>API unreachable`;
  }
}

$("back").onclick = () => { TRACE = null; FILTER = "ALL"; refresh(); };
refresh();
setInterval(refresh, 2000);
</script>
</body>
</html>
