<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AgentAssure — Operator Console</title>
<style>
/* ═══════════════════════════════════════════════════════════════════
   1. ROOT VARIABLES & RESET
   ═══════════════════════════════════════════════════════════════════ */
:root {
  --bg: #0b1220; --panel: #111c2e; --panel-2: #17263c;
  --line: #24354f; --text: #dbe5f2; --muted: #8398b3;
  --accent: #4f9cf9; --block: #ff5f6d; --ask: #ffb020;
  --allow: #3ed598; --mask: #59d5d0; --shadow-c: #8398b3;
  --sidebar-w: 210px; --drawer-w: 420px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:"Segoe UI",system-ui,-apple-system,sans-serif;font-size:14px;line-height:1.5;overflow:hidden;height:100vh}
a{color:var(--accent);text-decoration:none}
button{font-family:inherit}

/* ═══════════════════════════════════════════════════════════════════
   2. LAYOUT — SIDEBAR / MAIN / DRAWER
   ═══════════════════════════════════════════════════════════════════ */
#app{display:flex;height:100vh;width:100%}
#sidebar{width:var(--sidebar-w);min-width:var(--sidebar-w);background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;height:100vh;overflow-y:auto}
#main{flex:1;overflow-y:auto;padding:24px 28px 60px}
#drawer-overlay{position:fixed;top:0;right:0;width:0;height:100vh;background:rgba(11,18,32,.55);z-index:90;opacity:0;transition:opacity .2s}
#drawer-overlay.open{width:100%;opacity:1}
#drawer{position:fixed;top:0;right:0;width:var(--drawer-w);height:100vh;background:var(--panel);border-left:1px solid var(--line);z-index:100;transform:translateX(100%);transition:transform .25s ease;overflow-y:auto;padding:20px}
#drawer.open{transform:translateX(0)}

/* ═══════════════════════════════════════════════════════════════════
   3. SIDEBAR NAVIGATION
   ═══════════════════════════════════════════════════════════════════ */
.sb-logo{padding:20px 18px 6px;font-size:18px;font-weight:700;letter-spacing:.2px}
.sb-logo span{color:var(--accent)}
.sb-tag{padding:0 18px 18px;font-size:11px;color:var(--muted)}
.sb-nav{list-style:none;flex:1}
.sb-nav li{display:block}
.sb-nav a{display:flex;align-items:center;gap:10px;padding:10px 18px;color:var(--muted);font-size:13px;font-weight:500;border-left:3px solid transparent;transition:all .15s}
.sb-nav a:hover{color:var(--text);background:rgba(79,156,249,.06)}
.sb-nav a.active{color:var(--accent);border-left-color:var(--accent);background:rgba(79,156,249,.08)}
.sb-nav .icon{width:18px;text-align:center;font-size:15px;flex-shrink:0}
.sb-nav .p3{opacity:.5}
.sb-sep{height:1px;background:var(--line);margin:8px 18px}
.sb-status{padding:14px 18px;border-top:1px solid var(--line);font-size:11px;display:flex;align-items:center;gap:7px}
.sb-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.sb-dot.on{background:var(--allow);box-shadow:0 0 6px var(--allow)}
.sb-dot.off{background:var(--block)}
.sb-dot.re{background:var(--ask);animation:pulse 1.2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}

/* ═══════════════════════════════════════════════════════════════════
   4. CARDS & METRICS
   ═══════════════════════════════════════════════════════════════════ */
.page-title{font-size:18px;font-weight:700;margin-bottom:4px}
.page-sub{color:var(--muted);font-size:12px;margin-bottom:18px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(155px,1fr));gap:12px;margin-bottom:22px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.card .k{color:var(--muted);font-size:10.5px;text-transform:uppercase;letter-spacing:.6px;margin-bottom:5px}
.card .v{font-size:26px;font-weight:700;font-variant-numeric:tabular-nums}
.card.block .v{color:var(--block)} .card.ask .v{color:var(--ask)} .card.allow .v{color:var(--allow)} .card.mask .v{color:var(--mask)}

/* ═══════════════════════════════════════════════════════════════════
   5. PANELS, TABLES, CHIPS
   ═══════════════════════════════════════════════════════════════════ */
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:16px}
.panel h2{font-size:14px;margin-bottom:4px}
.panel .sub{color:var(--muted);font-size:12px;margin-bottom:12px}
table{width:100%;border-collapse:collapse}
th{text-align:left;color:var(--muted);font-size:10.5px;font-weight:600;text-transform:uppercase;letter-spacing:.5px;padding:7px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:8px 10px;border-bottom:1px solid rgba(36,53,79,.5);font-size:12.5px;vertical-align:top}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--panel-2)}
.mono{font-family:Consolas,"SF Mono",monospace;font-size:11.5px;color:var(--muted)}
.chip{display:inline-block;padding:2px 9px;border-radius:999px;font-size:10px;font-weight:700;letter-spacing:.3px;white-space:nowrap}
.chip.BLOCK,.chip.BLOCKED{background:rgba(255,95,109,.15);color:var(--block)}
.chip.ASK,.chip.PENDING_APPROVAL{background:rgba(255,176,32,.15);color:var(--ask)}
.chip.ALLOW,.chip.COMPLETED,.chip.APPROVED{background:rgba(62,213,152,.13);color:var(--allow)}
.chip.SHADOW{background:rgba(131,152,179,.15);color:var(--muted)}
.chip.FAILED{background:rgba(255,95,109,.15);color:var(--block)}
.cite{display:inline-block;font-size:10px;color:var(--accent);background:rgba(79,156,249,.1);padding:2px 7px;border-radius:4px;font-family:Consolas,monospace}
.reason{color:var(--muted);font-size:11.5px;max-width:50ch}
code.io{display:block;color:#a8c3e0;font-family:Consolas,monospace;font-size:11px;background:#0a1424;border:1px solid var(--line);border-radius:6px;padding:7px 10px;margin-top:5px;white-space:pre-wrap;word-break:break-all;max-height:180px;overflow-y:auto}
.empty{color:var(--muted);text-align:center;padding:30px;font-size:13px}
.pill{display:inline-flex;align-items:center;gap:7px;padding:6px 12px;border-radius:999px;font-size:12px;font-weight:600}
.pill.ok{background:rgba(62,213,152,.12);color:var(--allow);border:1px solid rgba(62,213,152,.35)}
.pill.bad{background:rgba(255,95,109,.12);color:var(--block);border:1px solid rgba(255,95,109,.4)}
.back-btn{background:none;border:none;color:var(--accent);font-weight:600;font-size:12.5px;cursor:pointer;padding:0;margin-bottom:14px}

/* ═══════════════════════════════════════════════════════════════════
   6. LIVE MONITOR TIMELINE
   ═══════════════════════════════════════════════════════════════════ */
.tl-row{display:flex;align-items:flex-start;gap:10px;padding:7px 12px;border-bottom:1px solid rgba(36,53,79,.4);font-size:12.5px;transition:background .1s}
.tl-row:hover{background:var(--panel-2)}
.tl-ts{flex-shrink:0;width:90px;font-family:Consolas,monospace;font-size:11.5px;color:var(--muted)}
.tl-tool{flex-shrink:0;width:150px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tl-dec{flex-shrink:0;width:90px}
.tl-trace{flex:1;font-family:Consolas,monospace;font-size:11px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tl-detail{font-size:11px;color:var(--muted)}
.monitor-header{display:flex;align-items:center;gap:14px;margin-bottom:14px;flex-wrap:wrap}
.monitor-header .stats{display:flex;gap:16px;font-size:12px;color:var(--muted)}
.monitor-header .stats b{color:var(--text);font-variant-numeric:tabular-nums}

/* ═══════════════════════════════════════════════════════════════════
   7. DAG VISUALIZATION
   ═══════════════════════════════════════════════════════════════════ */
.dag-container{overflow:auto;background:#0a1424;border:1px solid var(--line);border-radius:8px;margin-bottom:16px;min-height:100px;padding:10px}
.dag-container svg{display:block;margin:0 auto}
.dag-container svg .dag-node{cursor:pointer}
.dag-container svg .dag-node:hover rect{stroke-width:2.5}
.dag-container svg .dag-node.selected rect{stroke-width:3;filter:drop-shadow(0 0 6px currentColor)}

/* ═══════════════════════════════════════════════════════════════════
   8. DRAWER DETAIL PANEL
   ═══════════════════════════════════════════════════════════════════ */
.dr-close{background:none;border:none;color:var(--muted);font-size:22px;cursor:pointer;float:right;padding:0 4px;line-height:1}
.dr-close:hover{color:var(--text)}
.dr-title{font-size:16px;font-weight:700;margin-bottom:4px}
.dr-subtitle{color:var(--muted);font-size:12px;margin-bottom:16px}
.dr-section{margin-bottom:16px}
.dr-section h3{font-size:12px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);margin-bottom:6px;padding-bottom:4px;border-bottom:1px solid var(--line)}
.dr-field{display:flex;justify-content:space-between;padding:4px 0;font-size:12.5px;border-bottom:1px solid rgba(36,53,79,.3)}
.dr-field .lbl{color:var(--muted);flex-shrink:0;margin-right:12px}
.dr-field .val{text-align:right;word-break:break-all;font-family:Consolas,monospace;font-size:11.5px}
.dr-log-row{font-size:11.5px;font-family:Consolas,monospace;padding:4px 0;border-bottom:1px solid rgba(36,53,79,.25);line-height:1.4}
.dr-log-ts{color:var(--muted)}
.dr-log-lvl{font-weight:700}
.dr-log-lvl.INFO{color:var(--accent)}
.dr-log-lvl.WARN{color:var(--ask)}
.dr-log-lvl.ERROR{color:var(--block)}
.dr-not-exec{background:rgba(255,95,109,.1);border:1px solid rgba(255,95,109,.3);border-radius:6px;padding:10px 12px;color:var(--block);font-weight:600;font-size:12.5px;margin-top:8px;display:flex;align-items:center;gap:8px}

/* ═══════════════════════════════════════════════════════════════════
   9. PLACEHOLDER BANNER
   ═══════════════════════════════════════════════════════════════════ */
.placeholder-banner{background:var(--panel-2);border:1px dashed var(--line);border-radius:10px;padding:30px 24px;text-align:center;margin:24px 0}
.placeholder-banner .icon{font-size:32px;margin-bottom:8px;opacity:.5}
.placeholder-banner h3{font-size:15px;margin-bottom:6px}
.placeholder-banner p{color:var(--muted);font-size:13px;max-width:50ch;margin:0 auto}

/* ═══════════════════════════════════════════════════════════════════
   10. BAR CHARTS, FILTERS
   ═══════════════════════════════════════════════════════════════════ */
.bar-row{display:grid;grid-template-columns:1fr 46px;gap:10px;align-items:center;margin-bottom:10px}
.bar-label{font-size:12px}
.bar-label .pid{color:var(--muted);font-size:11px;font-family:Consolas,monospace}
.bar-track{background:var(--panel-2);border-radius:5px;height:6px;margin-top:4px;overflow:hidden}
.bar-fill{height:100%;background:var(--accent);border-radius:5px}
.bar-n{text-align:right;color:var(--muted);font-variant-numeric:tabular-nums}
.filters{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:10px}
.filters button{background:transparent;border:1px solid var(--line);color:var(--muted);padding:4px 11px;border-radius:6px;font-size:11.5px;font-weight:600;cursor:pointer}
.filters button.on{background:var(--accent);border-color:var(--accent);color:#062744}

/* ═══════════════════════════════════════════════════════════════════
   11. SCROLLBAR & MISC
   ═══════════════════════════════════════════════════════════════════ */
::-webkit-scrollbar{width:7px;height:7px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--line);border-radius:4px}
::-webkit-scrollbar-thumb:hover{background:var(--muted)}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:1100px){.cols{grid-template-columns:1fr}}
.flex-between{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px}
</style>
</head>
<body>

<!-- ═══════════════════════════════════════════════════════════════════
     HTML STRUCTURE
     ═══════════════════════════════════════════════════════════════════ -->
<div id="app">
  <!-- Sidebar -->
  <nav id="sidebar">
    <div class="sb-logo">Agent<span>Assure</span></div>
    <div class="sb-tag">Operator Console</div>
    <ul class="sb-nav">
      <li><a href="#overview" data-route="overview"><span class="icon">▣</span> Overview</a></li>
      <li><a href="#monitor" data-route="monitor"><span class="icon">⚡</span> Live Monitor</a></li>
      <li><a href="#traces" data-route="traces"><span class="icon">☰</span> Traces</a></li>
      <li><div class="sb-sep"></div></li>
      <li><a href="#policies" data-route="policies" class="p3"><span class="icon">⚙</span> Policies</a></li>
      <li><a href="#approvals" data-route="approvals" class="p3"><span class="icon">☐</span> Approvals</a></li>
      <li><div class="sb-sep"></div></li>
      <li><a href="#evidence" data-route="evidence"><span class="icon">⛓</span> Evidence</a></li>
    </ul>
    <div class="sb-status" id="ws-status">
      <span class="sb-dot off" id="ws-dot"></span>
      <span id="ws-label">Disconnected</span>
    </div>
  </nav>

  <!-- Main content -->
  <div id="main"></div>
</div>

<!-- Detail drawer overlay -->
<div id="drawer-overlay" onclick="Drawer.close()"></div>
<div id="drawer"></div>

<script>
/* ═══════════════════════════════════════════════════════════════════
   1. STATE & CONFIGURATION
   ═══════════════════════════════════════════════════════════════════ */
const S = {
  route: 'overview',
  routeParam: null,
  stats: null,
  traces: [],
  liveEvents: [],
  liveEventIds: new Set(),
  selectedTraceId: null,
  selectedTraceEvents: [],
  selectedNodeSpanId: null,
  wsConnected: false,
  evidenceFilter: 'ALL',
  refreshTimer: null,
};

/* ═══════════════════════════════════════════════════════════════════
   2. UTILITY HELPERS
   ═══════════════════════════════════════════════════════════════════ */
const $ = id => document.getElementById(id);
function esc(s){ return String(s??'').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function shortTs(ts){ return String(ts||'').slice(11,23); }
function fmtDuration(ms){ if(ms==null) return '—'; if(ms<1000) return ms+'ms'; return (ms/1000).toFixed(2)+'s'; }
function truncate(s,n){ s=String(s||''); return s.length>n ? s.slice(0,n)+'…' : s; }
function fmtJson(v){ if(v==null) return '—'; if(typeof v==='string'){ try{v=JSON.parse(v)}catch(e){return v;} } try{return JSON.stringify(v,null,2)}catch(e){return String(v)} }
function statusIcon(decision,status){
  if(decision==='BLOCK') return '✗';
  if(decision==='ASK') return '⏸';
  if(status==='blocked'||status==='BLOCKED') return '✗';
  if(status==='pending_approval'||status==='PENDING_APPROVAL') return '⏸';
  if(status==='failed'||status==='FAILED') return '⚠';
  if(status==='completed'||status==='COMPLETED'||decision==='ALLOW') return '✓';
  return '●';
}
function statusColor(decision,status){
  if(decision==='BLOCK'||status==='blocked'||status==='BLOCKED') return 'var(--block)';
  if(decision==='ASK'||status==='pending_approval'||status==='PENDING_APPROVAL') return 'var(--ask)';
  if(status==='failed'||status==='FAILED') return 'var(--block)';
  if(decision==='ALLOW'||status==='completed'||status==='COMPLETED') return 'var(--allow)';
  return 'var(--accent)';
}
function chipClass(s){ return (s||'').replace(/\s+/g,'_'); }
function isBlocked(span){ return span.decision==='BLOCK' || span.status==='blocked'; }

/* ═══════════════════════════════════════════════════════════════════
   3. API CLIENT
   ═══════════════════════════════════════════════════════════════════ */
const API = {
  async get(path){
    const r = await fetch(path);
    if(!r.ok) throw new Error(`${path} → ${r.status}`);
    return r.json();
  },
  stats()       { return this.get('/api/v1/stats'); },
  traces()      { return this.get('/traces'); },
  traceDetail(id){ return this.get('/traces/'+encodeURIComponent(id)); },
  traceEvents(id){ return this.get('/traces/'+encodeURIComponent(id)+'/events'); },
  event(id)     { return this.get('/events/'+encodeURIComponent(id)); },
  policies()    { return this.get('/policies'); },
  approvals(p)  { const q=new URLSearchParams(p||{}).toString(); return this.get('/approvals'+(q?'?'+q:'')); },
  evidence(tid) { return this.get('/evidence/'+encodeURIComponent(tid)); },
  verify(tid)   { return this.get('/evidence/'+encodeURIComponent(tid)+'/verify'); },
  logs(p)       { const q=new URLSearchParams(p||{}).toString(); return this.get('/logs'+(q?'?'+q:'')); },
  health()      { return this.get('/health'); },
};

/* ═══════════════════════════════════════════════════════════════════
   4. WEBSOCKET MANAGER
   ═══════════════════════════════════════════════════════════════════ */
const WS = {
  socket: null,
  delay: 1000,
  maxDelay: 30000,
  timer: null,
  pingTimer: null,

  connect(){
    if(this.socket && this.socket.readyState <= 1) return;
    const proto = location.protocol==='https:'?'wss':'ws';
    const url = `${proto}://${location.host}/ws/events`;
    try { this.socket = new WebSocket(url); } catch(e){ this.scheduleReconnect(); return; }

    this.socket.onopen = () => {
      S.wsConnected = true;
      this.delay = 1000;
      this._updateIndicator();
      // Start keepalive ping
      this.pingTimer = setInterval(()=>{ try{this.socket.send('ping')}catch(e){} }, 25000);
    };

    this.socket.onmessage = (e) => {
      try{
        const data = JSON.parse(e.data);
        if(data.type==='connected') return; // greeting
        if(typeof data==='string' && data==='pong') return;
        this._handleEvent(data);
      }catch(err){}
    };

    this.socket.onclose = () => {
      S.wsConnected = false;
      clearInterval(this.pingTimer);
      this._updateIndicator();
      this.scheduleReconnect();
    };

    this.socket.onerror = () => {
      S.wsConnected = false;
      this._updateIndicator();
    };
  },

  scheduleReconnect(){
    if(this.timer) clearTimeout(this.timer);
    $('ws-label').textContent = `Reconnecting (${Math.round(this.delay/1000)}s)…`;
    $('ws-dot').className = 'sb-dot re';
    this.timer = setTimeout(()=>{ this.connect(); }, this.delay);
    this.delay = Math.min(this.delay * 1.5, this.maxDelay);
  },

  _handleEvent(data){
    const eid = data.event_id;
    if(eid && !S.liveEventIds.has(eid)){
      S.liveEventIds.add(eid);
      S.liveEvents.unshift(data);
      if(S.liveEvents.length > 500) S.liveEvents.pop();
    }
    // Auto-update views if relevant
    if(S.route==='monitor') Views.monitor();
    if(S.route==='trace-detail' && S.routeParam && data.trace_id === S.routeParam){
      // Merge into selected trace events
      if(eid && !S.selectedTraceEvents.find(e=>e.event_id===eid)){
        S.selectedTraceEvents.push(data);
        Views.traceDetail(S.routeParam);
      }
    }
  },

  _updateIndicator(){
    const dot = $('ws-dot');
    const lbl = $('ws-label');
    if(S.wsConnected){ dot.className='sb-dot on'; lbl.textContent='Live'; }
    else { dot.className='sb-dot off'; lbl.textContent='Disconnected'; }
  },

  disconnect(){
    if(this.socket) try{this.socket.close()}catch(e){}
    clearInterval(this.pingTimer);
    clearTimeout(this.timer);
  }
};

/* ═══════════════════════════════════════════════════════════════════
   5. ROUTER
   ═══════════════════════════════════════════════════════════════════ */
function navigate(route, param){
  S.route = route;
  S.routeParam = param || null;

  // Update nav active state
  document.querySelectorAll('.sb-nav a').forEach(a => {
    const r = a.dataset.route;
    a.classList.toggle('active', r===route || (route==='trace-detail' && r==='traces'));
  });

  // Render view
  const main = $('main');
  Drawer.close();

  switch(route){
    case 'overview':   Views.overview(); break;
    case 'monitor':    Views.monitor(); break;
    case 'traces':     Views.traceList(); break;
    case 'trace-detail': Views.traceDetail(param); break;
    case 'policies':   Views.policies(); break;
    case 'approvals':  Views.approvals(); break;
    case 'evidence':   Views.evidence(); break;
    default:           Views.overview();
  }
}

// Hash-based routing
function initRouter(){
  window.addEventListener('hashchange', () => {
    const hash = location.hash.slice(1) || 'overview';
    const parts = hash.split('/');
    navigate(parts[0], parts.slice(1).join('/') || null);
  });
  const hash = location.hash.slice(1) || 'overview';
  const parts = hash.split('/');
  navigate(parts[0], parts.slice(1).join('/') || null);
}

/* ═══════════════════════════════════════════════════════════════════
   6. DAG ENGINE — Build, Layout, Render from span relationships
   ═══════════════════════════════════════════════════════════════════ */
const DECISION_PRI = { BLOCK:4, ASK:3, SHADOW:2, ALLOW:1 };

const DAG = {
  /**
   * Build a directed acyclic graph from trace events.
   * Groups events by span_id, determines status per span,
   * and constructs parent-child edges from parent_span_id.
   */
  build(events){
    if(!events || !events.length) return { roots:[], nodes:[], spanMap:{} };

    const spanMap = {};
    events.forEach(evt => {
      const sid = evt.span_id;
      if(!sid) return;
      if(!spanMap[sid]){
        spanMap[sid] = {
          span_id: sid,
          parent_span_id: evt.parent_span_id || null,
          tool_name: null, decision: null, status: null,
          event_type: null, policy_id: null, policy_version: null,
          reason: null, controls: null, input: null, output: null,
          timestamp: evt.timestamp, events: [], children: [],
          isSynthetic: false, executed: true
        };
      }
      const span = spanMap[sid];
      span.events.push(evt);

      if(evt.tool_name) span.tool_name = evt.tool_name;
      if(evt.parent_span_id) span.parent_span_id = evt.parent_span_id;
      if(evt.timestamp && (!span.timestamp || evt.timestamp > span.timestamp)) span.timestamp = evt.timestamp;
      if(evt.input != null && span.input == null) span.input = evt.input;
      if(evt.output != null) span.output = evt.output;
      if(evt.controls) span.controls = evt.controls;

      // Decision priority: BLOCK > ASK > SHADOW > ALLOW
      if(evt.decision){
        const pri = DECISION_PRI[evt.decision] || 0;
        const curPri = DECISION_PRI[span.decision] || 0;
        if(pri > curPri){
          span.decision = evt.decision;
          span.policy_id = evt.policy_id;
          span.policy_version = evt.policy_version;
          span.reason = evt.reason;
        }
      }

      // Determine execution status
      const et = evt.event_type;
      const st = evt.status;
      if(et==='tool_result' && st!=='failed') span.status = 'completed';
      if(et==='policy_decision' && evt.decision==='BLOCK'){ span.status='blocked'; span.executed=false; }
      if(et==='approval_requested'){ span.status='pending_approval'; span.executed=false; }
      if(et==='error'||st==='failed') span.status = 'failed';
      if(et==='tool_call' && !span.status) span.status = 'started';
    });

    // Find orphan parent_span_ids (synthetic roots)
    const spanIds = new Set(Object.keys(spanMap));
    const orphanParents = new Set();
    Object.values(spanMap).forEach(s => {
      if(s.parent_span_id && !spanIds.has(s.parent_span_id)){
        orphanParents.add(s.parent_span_id);
      }
    });

    orphanParents.forEach(pid => {
      spanMap[pid] = {
        span_id: pid, parent_span_id: null,
        tool_name: 'Agent', decision: null, status: 'completed',
        events: [], children: [], isSynthetic: true, executed: true,
        timestamp: null, input: null, output: null,
        policy_id: null, reason: null, controls: null
      };
    });

    // Build children lists
    const allSpans = Object.values(spanMap);
    allSpans.forEach(s => { s.children = []; });

    const roots = [];
    allSpans.forEach(s => {
      if(s.parent_span_id && spanMap[s.parent_span_id]){
        spanMap[s.parent_span_id].children.push(s);
      } else if(!s.parent_span_id){
        roots.push(s);
      }
    });

    // Sort children by timestamp
    allSpans.forEach(s => {
      s.children.sort((a,b) => (a.timestamp||'').localeCompare(b.timestamp||''));
    });

    // If only one synthetic root with children, keep it. If no roots, use all as flat.
    if(roots.length===0){
      // Fallback: treat all as roots
      allSpans.filter(s=>!s.parent_span_id || !spanMap[s.parent_span_id]).forEach(s => roots.push(s));
    }

    return { roots, nodes: allSpans, spanMap };
  },

  /**
   * Assign (x,y) positions to each node for SVG rendering.
   * Uses layered tree layout.
   */
  layout(dag){
    const NW = 190, NH = 56, HG = 28, VG = 65;

    if(!dag.nodes.length) return Object.assign(dag, {width:200, height:80, NW, NH});

    // BFS to assign depths
    const visited = new Set();
    const queue = dag.roots.map(r => ({node:r, depth:0}));
    const levels = [];

    while(queue.length){
      const {node, depth} = queue.shift();
      if(visited.has(node.span_id)) continue;
      visited.add(node.span_id);
      if(!levels[depth]) levels[depth] = [];
      levels[depth].push(node);
      node._depth = depth;
      node.children.forEach(c => queue.push({node:c, depth:depth+1}));
    }

    // Also add any unvisited nodes (disconnected)
    dag.nodes.forEach(n => {
      if(!visited.has(n.span_id)){
        if(!levels[0]) levels[0]=[];
        levels[0].push(n);
        n._depth = 0;
      }
    });

    // Position nodes
    const maxW = Math.max(...levels.map(l=>l.length), 1);
    const totalW = maxW * (NW + HG);

    levels.forEach((level, d) => {
      const lw = level.length * (NW + HG);
      const startX = (totalW - lw) / 2 + HG/2;
      level.forEach((node, i) => {
        node.x = startX + i*(NW + HG);
        node.y = d*(NH + VG) + 20;
      });
    });

    dag.width = Math.max(totalW + 20, 300);
    dag.height = levels.length * (NH + VG) + 20;
    dag.NW = NW;
    dag.NH = NH;
    return dag;
  },

  /**
   * Render the positioned DAG as an SVG element inside `container`.
   */
  render(dag, container){
    if(!dag.nodes.length){
      container.innerHTML = '<div class="empty">No events to visualize.</div>';
      return;
    }

    const ns = 'http://www.w3.org/2000/svg';
    const svg = document.createElementNS(ns, 'svg');
    svg.setAttribute('width', Math.max(dag.width, container.clientWidth - 20));
    svg.setAttribute('height', dag.height);
    svg.setAttribute('viewBox', `0 0 ${dag.width} ${dag.height}`);
    svg.style.minWidth = dag.width + 'px';

    const NW = dag.NW, NH = dag.NH;

    // Draw edges first (behind nodes)
    dag.nodes.forEach(node => {
      node.children.forEach(child => {
        if(node.x==null||child.x==null) return;
        const x1 = node.x + NW/2, y1 = node.y + NH;
        const x2 = child.x + NW/2, y2 = child.y;
        const my = (y1+y2)/2;
        const path = document.createElementNS(ns, 'path');
        path.setAttribute('d', `M${x1} ${y1} C${x1} ${my}, ${x2} ${my}, ${x2} ${y2}`);
        path.setAttribute('fill', 'none');
        path.setAttribute('stroke', '#24354f');
        path.setAttribute('stroke-width', '1.8');
        svg.appendChild(path);
      });
    });

    // Draw nodes
    dag.nodes.forEach(node => {
      if(node.x==null) return;
      const g = document.createElementNS(ns, 'g');
      g.setAttribute('class', 'dag-node' + (node.span_id===S.selectedNodeSpanId?' selected':''));
      g.setAttribute('transform', `translate(${node.x},${node.y})`);

      const sc = statusColor(node.decision, node.status);

      // Background rect
      const rect = document.createElementNS(ns, 'rect');
      rect.setAttribute('width', NW);
      rect.setAttribute('height', NH);
      rect.setAttribute('rx', '8');
      rect.setAttribute('fill', '#111c2e');
      rect.setAttribute('stroke', sc);
      rect.setAttribute('stroke-width', node.span_id===S.selectedNodeSpanId?'2.5':'1.4');
      g.appendChild(rect);

      // Left status bar
      const bar = document.createElementNS(ns, 'rect');
      bar.setAttribute('x', '0'); bar.setAttribute('y', '0');
      bar.setAttribute('width', '4'); bar.setAttribute('height', NH);
      bar.setAttribute('rx', '2');
      bar.setAttribute('fill', sc);
      g.appendChild(bar);

      // Status icon
      const ico = document.createElementNS(ns, 'text');
      ico.setAttribute('x', '14'); ico.setAttribute('y', '22');
      ico.setAttribute('font-size', '13'); ico.setAttribute('fill', sc);
      ico.textContent = statusIcon(node.decision, node.status);
      g.appendChild(ico);

      // Tool name
      const nm = document.createElementNS(ns, 'text');
      nm.setAttribute('x', '30'); nm.setAttribute('y', '22');
      nm.setAttribute('font-size', '12'); nm.setAttribute('font-weight', '600');
      nm.setAttribute('fill', '#dbe5f2');
      nm.textContent = truncate(node.tool_name || '(root)', 17);
      g.appendChild(nm);

      // Decision + status text
      const lbl = document.createElementNS(ns, 'text');
      lbl.setAttribute('x', '30'); lbl.setAttribute('y', '40');
      lbl.setAttribute('font-size', '10'); lbl.setAttribute('font-weight', '600');
      lbl.setAttribute('fill', sc);
      let lblText = node.decision || '';
      if(isBlocked(node)) lblText += ' · NOT EXECUTED';
      else if(node.status==='pending_approval') lblText += ' · PENDING';
      else if(node.status==='completed') lblText += node.decision ? '' : ' COMPLETED';
      lbl.textContent = truncate(lblText, 24);
      g.appendChild(lbl);

      // Click handler
      g.addEventListener('click', () => { S.selectedNodeSpanId = node.span_id; Drawer.open(node); DAG.render(dag, container); });

      svg.appendChild(g);
    });

    container.innerHTML = '';
    container.appendChild(svg);
  }
};

      const traces = await API.traces();
      S.traces = traces;
      const sel = $('ev-trace-select');
      sel.innerHTML = '<div class="panel"><h2>Select Trace</h2><p class="sub">Choose a trace to inspect its evidence records and verify integrity.</p>' +
        (!traces.length ? '<div class="empty">No traces available.</div>' :
        `<table><thead><tr><th>Trace</th><th>Agent</th><th>Events</th><th>Status</th><th>Action</th></tr></thead><tbody>
        ${traces.map(t=>`<tr>
          <td class="mono">${esc(truncate(t.trace_id,18))}</td>
          <td>${esc(t.agent_id)}</td>
          <td>${t.events_count}</td>
          <td><span class="chip ${chipClass(t.status)}">${esc(t.status)}</span></td>
          <td><button onclick="Views._loadEvidence('${esc(t.trace_id)}')" style="background:var(--accent);color:#062744;border:none;padding:4px 12px;border-radius:6px;font-size:11px;font-weight:600;cursor:pointer">Inspect</button></td>
        </tr>`).join('')}</tbody></table>`) + '</div>';
    }catch(e){
      $('ev-trace-select').innerHTML = `<div class="empty">Failed to load traces: ${esc(e.message)}</div>`;
    }
  },

  async _loadEvidence(traceId){
    const el = $('ev-body');
    el.innerHTML = '<div class="empty">Loading evidence…</div>';

    try{
      const [records, verification] = await Promise.all([
        API.evidence(traceId),
        API.verify(traceId)
      ]);

      const ok = verification.valid;
      el.innerHTML = `
        <div class="panel">
          <div class="flex-between" style="margin-bottom:12px">
            <h2>Evidence — <span class="mono">${esc(truncate(traceId,20))}</span></h2>
            <span class="pill ${ok?'ok':'bad'}"><span class="sb-dot ${ok?'on':'off'}"></span>
              Evidence chain: ${ok?'VERIFIED':'FAILED'} · ${verification.records_checked} records checked
            </span>
          </div>
          ${!ok?`<div class="dr-not-exec" style="margin-bottom:12px">⚠ ${verification.errors.length} integrity error(s) detected: ${esc(verification.errors.join('; '))}</div>`:''}
          <table><thead><tr>
            <th>Record</th><th>Time</th><th>Type</th><th>Tool</th><th>Decision</th><th>Policy</th><th>Controls</th><th>Redactions</th><th>Hash</th>
          </tr></thead><tbody>
          ${records.map(r=>`<tr>
            <td class="mono">${esc(truncate(r.record_id||'',14))}</td>
            <td class="mono">${shortTs(r.timestamp)}</td>
            <td class="mono">${esc(r.event_type)}</td>
            <td>${esc(r.tool_name||'—')}</td>
            <td>${r.decision?`<span class="chip ${chipClass(r.decision)}">${esc(r.decision)}</span>`:''}</td>
            <td class="mono">${esc(r.policy_id||'—')}</td>
            <td>${r.controls?`<span class="cite">${esc(r.controls)}</span>`:'—'}</td>
            <td>${r.redactions||0}</td>
            <td class="mono">${esc(truncate(r.record_hash||'',12))}</td>
          </tr>`).join('')}
          </tbody></table>
        </div>`;
    }catch(e){
      el.innerHTML = `<div class="empty">Failed to load evidence: ${esc(e.message)}</div>`;
    }
  },
};

/* ═══════════════════════════════════════════════════════════════════
   8. DRILL-DOWN DRAWER
   ═══════════════════════════════════════════════════════════════════ */
const Drawer = {
  async open(spanNode){
    S.selectedNodeSpanId = spanNode.span_id;
    const d = $('drawer');
    const o = $('drawer-overlay');

    let html = `<button class="dr-close" onclick="Drawer.close()">&times;</button>`;
    html += `<div class="dr-title">${esc(spanNode.tool_name || 'Node')}</div>`;
    html += `<div class="dr-subtitle">Span: <span class="mono">${esc(spanNode.span_id)}</span></div>`;

    // Status section
    html += `<div class="dr-section"><h3>Status</h3>`;
    html += `<div class="dr-field"><span class="lbl">Decision</span><span class="val"><span class="chip ${chipClass(spanNode.decision||'')}">${statusIcon(spanNode.decision,spanNode.status)} ${esc(spanNode.decision||'—')}</span></span></div>`;
    html += `<div class="dr-field"><span class="lbl">Tool</span><span class="val">${esc(spanNode.tool_name||'—')}</span></div>`;
    html += `<div class="dr-field"><span class="lbl">Execution</span><span class="val" style="color:${isBlocked(spanNode)?'var(--block)':spanNode.status==='pending_approval'?'var(--ask)':'var(--allow)'}">${isBlocked(spanNode)?'NOT EXECUTED':spanNode.status==='pending_approval'?'PENDING APPROVAL':spanNode.executed?'EXECUTED':'—'}</span></div>`;
    html += `<div class="dr-field"><span class="lbl">Timestamp</span><span class="val">${esc(spanNode.timestamp||'—')}</span></div>`;
    html += `</div>`;

    // NOT EXECUTED warning
    if(isBlocked(spanNode)){
      html += `<div class="dr-not-exec">✗ Tool execution was prevented by policy enforcement. The underlying function was NOT called.</div>`;
    }
    if(spanNode.status==='pending_approval'){
      html += `<div class="dr-not-exec" style="background:rgba(255,176,32,.1);border-color:rgba(255,176,32,.3);color:var(--ask)">⏸ Tool execution suspended pending human approval.</div>`;
    }

    // Arguments section
    if(spanNode.input != null){
      html += `<div class="dr-section"><h3>Arguments</h3><code class="io">${esc(fmtJson(spanNode.input))}</code></div>`;
    }

    // Output section
    if(spanNode.output != null && !isBlocked(spanNode)){
      html += `<div class="dr-section"><h3>Output</h3><code class="io">${esc(fmtJson(spanNode.output))}</code></div>`;
    }

    // Policy section
    if(spanNode.policy_id || spanNode.reason){
      html += `<div class="dr-section"><h3>Policy Evaluation</h3>`;
      if(spanNode.policy_id) html += `<div class="dr-field"><span class="lbl">Policy</span><span class="val">${esc(spanNode.policy_id)}</span></div>`;
      if(spanNode.policy_version) html += `<div class="dr-field"><span class="lbl">Version</span><span class="val">v${spanNode.policy_version}</span></div>`;
      if(spanNode.decision) html += `<div class="dr-field"><span class="lbl">Decision</span><span class="val">${esc(spanNode.decision)}</span></div>`;
      if(spanNode.reason) html += `<div class="dr-field"><span class="lbl">Reason</span><span class="val" style="font-family:inherit;font-size:12px;max-width:260px">${esc(spanNode.reason)}</span></div>`;
      if(spanNode.controls) html += `<div class="dr-field"><span class="lbl">Controls</span><span class="val"><span class="cite">${esc(spanNode.controls)}</span></span></div>`;
      html += `</div>`;
    }

    // Correlated logs placeholder
    html += `<div class="dr-section"><h3>Runtime Logs</h3><div id="dr-logs">Loading…</div></div>`;

    // Evidence placeholder
    html += `<div class="dr-section"><h3>Evidence Records</h3><div id="dr-evidence">Loading…</div></div>`;

    d.innerHTML = html;
    d.classList.add('open');
    o.classList.add('open');

    // Load correlated logs
    this._loadLogs(spanNode);
    // Load evidence for this span's events
    this._loadSpanEvidence(spanNode);

    // Re-render DAG with selection highlight
    if(S._currentDAG && S._currentDAGContainer){
      DAG.render(S._currentDAG, S._currentDAGContainer);
    }
  },

  async openByEventId(eventId, spanId){
    // Find span node from current trace events
    if(S.selectedTraceEvents.length){
      const spanEvents = S.selectedTraceEvents.filter(e => e.span_id === spanId);
      if(spanEvents.length){
        // Build a synthetic span node
        const node = this._buildSpanFromEvents(spanEvents, spanId);
        this.open(node);
        return;
      }
    }
    // Fallback: fetch event and build minimal node
    try{
      const evt = await API.event(eventId);
      const node = this._buildSpanFromEvents([evt], spanId);
      this.open(node);
    }catch(e){}
  },

  _buildSpanFromEvents(events, spanId){
    const node = {
      span_id: spanId, parent_span_id: null,
      tool_name: null, decision: null, status: null,
      policy_id: null, policy_version: null, reason: null, controls: null,
      input: null, output: null, timestamp: null, events: events,
      executed: true, isSynthetic: false
    };
    events.forEach(evt => {
      if(evt.tool_name) node.tool_name = evt.tool_name;
      if(evt.parent_span_id) node.parent_span_id = evt.parent_span_id;
      if(evt.timestamp) node.timestamp = evt.timestamp;
      if(evt.input != null && node.input == null) node.input = evt.input;
      if(evt.output != null) node.output = evt.output;
      if(evt.controls) node.controls = evt.controls;
      if(evt.decision){
        const pri = DECISION_PRI[evt.decision]||0;
        if(pri > (DECISION_PRI[node.decision]||0)){
          node.decision = evt.decision;
          node.policy_id = evt.policy_id;
          node.policy_version = evt.policy_version;
          node.reason = evt.reason;
        }
      }
      if(evt.event_type==='tool_result') node.status = 'completed';
      if(evt.event_type==='policy_decision' && evt.decision==='BLOCK'){ node.status='blocked'; node.executed=false; }
      if(evt.event_type==='approval_requested'){ node.status='pending_approval'; node.executed=false; }
    });
    return node;
  },

  async _loadLogs(spanNode){
    const el = $('dr-logs');
    if(!el) return;
    try{
      // Load logs for each event in this span
      const eventIds = spanNode.events.map(e=>e.event_id).filter(Boolean);
      let logs = [];
      if(eventIds.length){
        // Get logs by trace_id and filter by span events
        const traceId = spanNode.events[0]?.trace_id;
        if(traceId){
          const allLogs = await API.logs({trace_id: traceId, limit: 200});
          logs = allLogs.filter(l => l.span_id === spanNode.span_id || eventIds.includes(l.event_id));
        }
      }
      if(!logs.length){ el.innerHTML='<div class="empty" style="padding:8px">No correlated logs found.</div>'; return; }

      el.innerHTML = logs.map(l => `<div class="dr-log-row">
        <span class="dr-log-ts">${shortTs(l.timestamp)}</span>
        <span class="dr-log-lvl ${esc(l.level)}">${esc(l.level)}</span>
        <span style="color:var(--muted);margin:0 4px">${esc(l.component)}</span>
        ${esc(l.message)}
      </div>`).join('');
    }catch(e){
      el.innerHTML = `<div class="empty" style="padding:8px">Failed to load logs.</div>`;
    }
  },

  async _loadSpanEvidence(spanNode){
    const el = $('dr-evidence');
    if(!el) return;
    try{
      const traceId = spanNode.events[0]?.trace_id;
      if(!traceId){ el.innerHTML='<div class="empty" style="padding:8px">No trace context.</div>'; return; }

      const records = await API.evidence(traceId);
      const spanRecords = records.filter(r => r.span_id === spanNode.span_id);

      if(!spanRecords.length){ el.innerHTML='<div class="empty" style="padding:8px">No evidence records for this span.</div>'; return; }

      el.innerHTML = spanRecords.map(r => `<div style="background:#0a1424;border:1px solid var(--line);border-radius:6px;padding:10px;margin-bottom:8px;font-size:12px">
        <div class="dr-field"><span class="lbl">Record ID</span><span class="val">${esc(r.record_id)}</span></div>
        <div class="dr-field"><span class="lbl">Event Type</span><span class="val">${esc(r.event_type)}</span></div>
        <div class="dr-field"><span class="lbl">Decision</span><span class="val">${r.decision?`<span class="chip ${chipClass(r.decision)}">${esc(r.decision)}</span>`:''}</span></div>
        <div class="dr-field"><span class="lbl">Policy</span><span class="val">${esc(r.policy_id||'—')} ${r.policy_version?'v'+r.policy_version:''}</span></div>
        ${r.controls?`<div class="dr-field"><span class="lbl">Controls</span><span class="val"><span class="cite">${esc(r.controls)}</span></span></div>`:''}
        <div class="dr-field"><span class="lbl">Redactions</span><span class="val">${r.redactions||0}</span></div>
        <div class="dr-field"><span class="lbl">Hash</span><span class="val mono">${esc(truncate(r.record_hash||'',20))}</span></div>
      </div>`).join('');
    }catch(e){
      el.innerHTML = `<div class="empty" style="padding:8px">Failed to load evidence.</div>`;
    }
  },

  close(){
    S.selectedNodeSpanId = null;
    $('drawer').classList.remove('open');
    $('drawer-overlay').classList.remove('open');
    // Re-render DAG without selection
    if(S._currentDAG && S._currentDAGContainer){
      DAG.render(S._currentDAG, S._currentDAGContainer);
    }
  }
};

/* ═══════════════════════════════════════════════════════════════════
   9. PERIODIC REFRESH (for overview metrics)
   ═══════════════════════════════════════════════════════════════════ */
function startPeriodicRefresh(){
  if(S.refreshTimer) clearInterval(S.refreshTimer);
  S.refreshTimer = setInterval(()=>{
    if(S.route==='overview') Views.overview();
  }, 5000);
}

/* ═══════════════════════════════════════════════════════════════════
   10. INITIALIZATION
   ═══════════════════════════════════════════════════════════════════ */
document.addEventListener('DOMContentLoaded', () => {
  WS.connect();
  initRouter();
  startPeriodicRefresh();
});
</script>
</body>
</html>
