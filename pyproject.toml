[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agentassure"
version = "0.1.0"
description = "Runtime governance and assurance layer for AI agents"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "pydantic>=2.0.0",
    "pyyaml>=6.0",
    # server/ imports these; [tool.setuptools.packages.find] ships the server
    # package, so they are runtime dependencies of the distribution. Note that
    # requirements.txt does not cover this: uv and other modern installers
    # resolve from pyproject.toml in preference to it, so an omission here
    # produces a package whose server module cannot be imported.
    "fastapi>=0.100.0",
    "uvicorn>=0.22.0",
]

[tool.setuptools.packages.find]
include = ["agentassure*", "server*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

